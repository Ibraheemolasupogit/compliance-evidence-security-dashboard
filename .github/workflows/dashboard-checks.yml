name: Dashboard Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate dashboard outputs
        run: PYTHONPATH=src python -m compliance_security_dashboard.main
      - name: Compile dashboard
        run: python -m compileall dashboard
      - name: Dashboard helper tests
        run: pytest tests/test_dashboard_utils.py
